name: Import reviewed source once
on:
  push:
    branches: [main]
    paths: [source-release.zip]
  workflow_dispatch:
permissions:
  contents: write
concurrency: reviewed-source-import
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Import the reviewed v0.2.2 archive
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/source-import"
          cd "$RUNNER_TEMP/source-import"
          if test -f .source-imported-0.2.2; then
            echo 'This source archive has already been imported. No changes.'
            exit 0
          fi
          echo '0b98d1f87cb87c80d7ee5ea94b10d620eac51ae53f60d8631fe03ec034dda4e6  source-release.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib
          allowed = {'README.md','LICENSE','SECURITY.md','.gitignore','build.ps1','BUILD-NOTES.txt','使用说明.txt'}
          with zipfile.ZipFile('source-release.zip') as z:
              for f in z.infolist():
                  p = pathlib.PurePosixPath(f.filename)
                  if p.is_absolute() or '..' in p.parts or '.git' in p.parts:
                      raise SystemExit('Unsafe archive entry')
                  if not (f.filename in allowed or f.filename.startswith(('source/', 'licenses/'))):
                      raise SystemExit('Entry outside reviewed source paths')
              z.extractall('.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' 'Reviewed v0.2.2 source imported once.' > .source-imported-0.2.2
          git add -- source licenses README.md LICENSE SECURITY.md .gitignore build.ps1 BUILD-NOTES.txt 使用说明.txt .source-imported-0.2.2
          git commit -m 'Import reviewed Argonmine Desktop 0.2.2 source and licenses'
          git -c credential.helper='!gh auth git-credential' push origin HEAD:main
